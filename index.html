<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Words That Needed Out</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #17120f;
      color: #f5eee8;
      text-align: center;
    }

    header {
      padding: 50px 20px 30px;
      background: #241914;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .tagline {
      font-style: italic;
      color: #d8b99b;
      font-size: 18px;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .song-card {
      background: #2a1e18;
      border: 1px solid #684b3b;
      border-radius: 18px;
      padding: 30px;
      margin-top: 30px;
    }

    h2 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
      margin-top: 25px;
    }

    .coming-soon {
      margin-top: 35px;
      color: #c9a98d;
    }

    footer {
      margin-top: 60px;
      padding: 30px;
      color: #9d8878;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Words That Needed Out</h1>
    <div class="tagline">
      When the words aren't there, we write the song.
    </div>
  </header>

  <main>

    <div class="song-card">
      <h2>Still Here</h2>

      <p>A song from Words That Needed Out</p>

      <audio controls>
        <source src="songs/still%20here.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
    </div>

    <div class="coming-soon">
      More songs coming soon...
    </div>

  </main>

  <footer>
    © 2026 Words That Needed Out
  </footer>

</body>
</html>
